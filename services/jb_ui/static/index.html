<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Tell Chromium up front this page is dark, so the moment before first
     paint is dark too instead of a white flash at kiosk startup. -->
<meta name="color-scheme" content="dark">
<style>html { background: #0b0b0f; }</style>
<title>Juk3box</title>
<!-- Vendored, pinned copy: the kiosk must boot without internet, and an
     unpinned CDN URL silently changes versions under us. -->
<script src="mqtt-5.16.0.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0b0b0f; color: #f2f2f2;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    cursor: none;
  }
  #bg {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; z-index: 0;
  }
  #scrim {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.55); z-index: 1;
  }
  #wrap {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    height: 100%; padding: 80px; box-sizing: border-box;
    gap: 12px;
  }

  /* shared wireframe box look */
  .box {
    border: 1px dashed rgba(255,255,255,0.35);
    border-radius: 8px;
    background: rgba(255,255,255,0.03);
  }
  .box-label {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    padding: 4px 8px;
  }

  /* header */
  #header {
    display: flex; align-items: center; gap: 12px;
    height: 70px; flex-shrink: 0;
  }
  #logo {
    flex: 1;
    display: flex; align-items: center; justify-content: flex-start;
    height: 100%;
  }
  /* logo.png is Images/juk3_box logo.png downscaled to 2x display size */
  #logo img { height: 100%; width: auto; display: block; }
  #tabs {
    flex: 1; display: flex; justify-content: flex-end;
    gap: 6px; padding: 0 10px;
  }
  .tab {
    display: flex; align-items: center; justify-content: center;
    height: 60px; padding: 0 24px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px;
    font-size: 22px; letter-spacing: 0.5px;
    color: rgba(255,255,255,0.6);
    white-space: nowrap;
  }
  .tab.active {
    border-color: #facc15;
    color: #facc15;
    background: rgba(250,204,21,0.08);
  }

  /* board */
  /* Layered art, not one painted board: the chrome frame is a 9-slice
     border image (corners/edges stay pixel-exact at any board size, only
     the dark middle stretches); strips are styled per cell below. The art
     is authored at 2x -- slice 80 image px = 40 CSS px of corner. Padding
     clears the frame's visible thickness (~26px top/bottom, ~33px sides). */
  #board {
    flex: 1;
    display: flex; gap: 14px;
    min-height: 0;
    border: 1px solid transparent;
    /* Only shapes the encoder-highlight outline (a border-image isn't
       clipped by radius); ~matches the frame art's rounded chrome corners. */
    border-radius: 18px;
    background: none;
    border-image: url(img/songboard_background.png) 80 fill / 40px stretch;
    padding: 26px 32px;
  }
  .col {
    flex: 1; display: flex; flex-direction: column;
    gap: 1px; overflow: hidden;
    background: #d3cab5; /* shows through the 1px gaps as strip separators */
  }
  .slot {
    flex: 1;
    display: flex; align-items: stretch;
    background: #ded5c1; /* cream, sampled from the mockup */
    min-height: 0;
  }
  .slot .label {
    flex-shrink: 0; width: 38px;
    display: flex; align-items: center; justify-content: center;
    background: url(img/songboard_numbers.png) center / 100% 100%;
    color: #fff; font-weight: bold; font-size: 13px;
    text-shadow: 0 1px 1px rgba(0,0,0,0.5);
  }
  .slot .text {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 8px;
    line-height: 1.15;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .slot .title, .slot .artist { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .title { color: #111316; font-size: 12px; font-weight: 600; }
  .slot .artist { color: #3f4a47; font-size: 10px; font-weight: 500; }
  .slot .artist:empty { display: none; }

  /* control row: volume + prev/next page + shuffle + now playing + up next */
  #bottom { display: flex; gap: 12px; height: 110px; flex-shrink: 0; }
  #volume-btn,
  #shuffle-btn,
  .square-btn {
    flex: 0 0 90px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
  }
  #shuffle-icon, .square-icon { font-size: 28px; opacity: 0.7; }
  .square-label { font-size: 11px; letter-spacing: 1px; opacity: 0.7; white-space: nowrap; }
  /* pure-CSS speaker icon -- no font glyph coverage needed (the emoji
     speaker showed as a "tofu" box, this Pi has no emoji font installed) */
  #volume-icon {
    position: relative;
    width: 26px; height: 24px;
    opacity: 0.7;
  }
  #volume-icon::before {
    content: '';
    position: absolute; left: 0; top: 6px;
    width: 9px; height: 12px;
    background: #f2f2f2;
    clip-path: polygon(0 25%, 40% 25%, 100% 0, 100% 100%, 40% 75%, 0 75%);
  }
  #volume-icon::after {
    content: '';
    position: absolute; left: 13px; top: 5px;
    width: 11px; height: 14px;
    border: 2px solid #f2f2f2;
    border-left: none;
    border-radius: 0 50% 50% 0 / 0 50% 50% 0;
  }
  #shuffle-label { font-size: 11px; letter-spacing: 1px; opacity: 0.7; }
  #shuffle-btn.active #shuffle-icon,
  #shuffle-btn.active #shuffle-label { color: #facc15; opacity: 1; }
  #now-playing {
    flex: 1; display: flex; align-items: center; gap: 12px; padding: 10px;
    position: relative; overflow: hidden;
  }
  #now-playing > :not(#np-bg) { position: relative; z-index: 1; }
  /* Backdrop: the current track's cover, blown up and rotated 45deg. A
     rotated square covers a w x h box once its side >= (w+h)/sqrt(2);
     at 130% of the box width that holds with lots of margin. A dark
     gradient over it keeps the text readable. */
  #np-bg {
    position: absolute; top: 50%; left: 50%; z-index: 0;
    width: 130%; aspect-ratio: 1;
    transform: translate(-50%, -50%) rotate(45deg);
    background: center / cover no-repeat;
    opacity: 0; transition: opacity 600ms ease;
  }
  #np-bg.visible { opacity: 1; }
  #np-bg::after {
    content: ''; position: absolute; inset: 0;
    transform: rotate(-45deg); /* shade stays level with the box, not the art */
    background: linear-gradient(90deg, rgba(0,0,0,0.55), rgba(0,0,0,0.75));
  }
  #now-playing .art { width: 80px; height: 80px; flex-shrink: 0; background-size: cover; background-position: center; }
  #now-playing .info { flex: 1; min-width: 0; }
  #now-playing .info .label { display: block; }
  #np-title { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #np-progress-wrap { display: flex; align-items: center; gap: 6px; font-size: 10px; opacity: 0.6; margin-top: 4px; }
  .np-progress-track { flex: 1; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; overflow: hidden; }
  #np-progress-bar { height: 100%; width: 0%; background: #facc15; }
  #now-playing .transport { display: flex; gap: 10px; font-size: 20px; opacity: 0.6; }
  /* Up Next, styled after the mockup: amber header + rule, then big-art
     items (art, amber queue number, title over artist) with dividers.
     ~3 fit across; the rest side-scroll. The native scrollbar is hidden
     (it would shift the layout when shown); a thin custom indicator
     overlays the bottom edge only while the encoder is in scroll mode. */
  #up-next {
    flex: 1; min-width: 0; position: relative;
    display: flex; flex-direction: column;
    padding: 8px 14px 10px;
  }
  #up-next-header {
    flex-shrink: 0;
    font-size: 12px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
    color: #f5a524;
    padding-bottom: 5px; margin-bottom: 8px;
    border-bottom: 1px solid rgba(245,165,36,0.45);
  }
  #up-next-list {
    flex: 1; min-height: 0;
    display: flex; align-items: center;
    overflow-x: auto; overflow-y: hidden;
    scroll-behavior: smooth;
    scrollbar-width: none;
  }
  .queue-item {
    flex: 0 0 auto; width: 230px; box-sizing: border-box;
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px;
    border-left: 1px solid rgba(245,165,36,0.35);
  }
  .queue-item:first-child { border-left: none; padding-left: 0; }
  .queue-item .art {
    flex-shrink: 0; width: 56px; height: 56px; box-sizing: border-box;
    border: 2px solid rgba(255,255,255,0.8); border-radius: 3px;
    background: rgba(255,255,255,0.06) center / cover no-repeat;
  }
  .queue-item:first-child .art { border-color: #f5a524; } /* plays next */
  .queue-item .num {
    align-self: flex-start; padding-top: 2px;
    color: #f5a524; font-size: 17px; font-weight: 600;
  }
  .queue-item .meta {
    min-width: 0; display: flex; flex-direction: column; gap: 3px;
    text-transform: uppercase; letter-spacing: 1px; line-height: 1.2;
  }
  .queue-item .title, .queue-item .artist {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden;
  }
  .queue-item .title { color: #f2f2f2; font-size: 12px; font-weight: 600; }
  .queue-item .artist { color: #9fb3c8; font-size: 10px; -webkit-line-clamp: 1; }
  #upnext-empty-msg { margin: auto; font-size: 13px; opacity: 0.5; text-align: center; padding: 0 20px; }
  #up-next-scroll {
    position: absolute; left: 14px; right: 14px; bottom: 4px; height: 3px;
    border-radius: 2px; background: rgba(255,255,255,0.1);
    opacity: 0; transition: opacity 300ms ease;
  }
  #up-next.scrolling #up-next-scroll { opacity: 1; }
  #up-next-scroll-thumb {
    position: absolute; top: 0; bottom: 0; left: 0; width: 100%;
    border-radius: 2px; background: #f5a524;
  }

  /* sort menu -- lives in the popup, opened by clicking the board */
  #sort-menu { display: none; gap: 16px; justify-content: center; }
  #sort-menu.visible { display: flex; }
  .sort-opt {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    min-width: 120px; padding: 14px 22px; white-space: nowrap;
    border: 1px solid rgba(255,255,255,0.25); border-radius: 8px;
    font-size: 22px; color: rgba(255,255,255,0.6);
  }
  .sort-opt.chosen { border-color: #facc15; color: #facc15; }
  .sort-opt.cursor { outline: 3px solid #7dd3fc; outline-offset: 2px; }
  .sort-value {
    font-size: 13px; color: #facc15; opacity: 0.85;
    max-width: 160px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sort-value:empty { display: none; }

  /* encoder selection highlight -- rotating the encoder cycles this among
     every [data-select] element; clicking fires that element's action.
     Outline width/offset stay constant and only the color fades, since
     outline-style can't be animated but outline-color can. */
  [data-select] {
    outline: 3px solid transparent;
    outline-offset: 2px;
    transition: outline-color 600ms ease;
  }
  [data-select].encoder-selected {
    outline-color: #7dd3fc;
  }

  /* popup overlay: volume/phone/library/spotify/now-playing open one of
     these when clicked. Volume's also stays open while the encoder's
     rotation is repurposed as the volume slider. */
  #popup-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 10;
    background: rgba(0,0,0,0.7);
    align-items: center; justify-content: center;
  }
  #popup-overlay.visible { display: flex; }
  #popup-box {
    background: #14141a; border: 1px solid rgba(255,255,255,0.2); border-radius: 16px;
    padding: 48px 64px; min-width: 420px; text-align: center;
  }
  #popup-title { font-size: 42px; letter-spacing: 3px; margin-bottom: 24px; }
  #popup-body { font-size: 20px; opacity: 0.8; }
  .volume-slider-track {
    width: 320px; height: 14px; border-radius: 7px;
    background: rgba(255,255,255,0.15); overflow: hidden; margin: 0 auto;
  }
  .volume-slider-fill { height: 100%; background: #facc15; }
  .volume-pct { font-size: 28px; margin-top: 16px; }

  #debug {
    position: fixed; bottom: 10px; left: 12px; z-index: 3;
    max-width: 40%;
    font-family: "SF Mono", Menlo, monospace; font-size: 10px;
    opacity: 0.6;
  }
  #status { color: #888; margin-bottom: 4px; }
  #status.connected { color: #4ade80; }
  #status.disconnected { color: #f87171; }
  #log { max-height: 90px; overflow: hidden; }
  .line { line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topic { color: #7dd3fc; margin-right: 8px; }
  .payload { color: #d4d4d8; }
</style>
</head>
<body>
<video id="bg" src="bg.mp4" autoplay muted loop playsinline></video>
<div id="scrim"></div>
<div id="wrap">

  <div id="header">
    <div id="logo"><img src="img/logo.png" alt="Juk3box"></div>
    <div id="tabs">
      <div class="tab" data-select="phone" id="sel-phone">Bluetooth</div>
      <div class="tab" data-select="library" id="sel-library">Library</div>
      <div class="tab" data-select="spotify" id="sel-spotify">Spotify</div>
    </div>
  </div>

  <div id="bottom">
    <div id="volume-btn" class="box" data-select="volume">
      <div id="volume-icon"></div>
    </div>
    <div id="back-btn" class="box square-btn" data-select="back">
      <div class="square-icon">&larr;</div>
      <div class="square-label">PREV PAGE</div>
    </div>
    <div id="forward-btn" class="box square-btn" data-select="forward">
      <div class="square-icon">&rarr;</div>
      <div class="square-label">NEXT PAGE</div>
    </div>
    <div id="shuffle-btn" class="box" data-select="shuffle">
      <div id="shuffle-icon">&#8646;</div>
      <div id="shuffle-label">SHUFFLE</div>
    </div>
    <div id="now-playing" class="box" data-select="nowplaying">
      <div id="np-bg"></div>
      <div id="np-art" class="art box"></div>
      <div class="info">
        <span class="box-label">now playing</span>
        <div id="np-title">—</div>
        <div id="np-artist" style="opacity:0.5">—</div>
        <div id="np-progress-wrap">
          <span id="np-elapsed">0:00</span>
          <div class="np-progress-track">
            <div id="np-progress-bar"></div>
          </div>
          <span id="np-duration">0:00</span>
        </div>
        <div class="transport">
          <span id="np-prev">&#9664;&#9664;</span>
          <span id="np-playpause">&#9654;</span>
          <span id="np-next">&#9654;&#9654;</span>
        </div>
      </div>
    </div>
    <div id="up-next" class="box" data-select="upnext">
      <div id="up-next-header">Up Next</div>
      <div id="up-next-list"></div>
      <div id="up-next-scroll"><div id="up-next-scroll-thumb"></div></div>
    </div>
  </div>

  <!-- The board is itself selectable: clicking it opens the Sort menu
       (it replaced a separate sort row, to give the board more height). -->
  <div id="board" class="box" data-select="board"></div>

</div>

<div id="popup-overlay">
  <div id="popup-box">
    <div id="popup-title"></div>
    <div id="popup-body"></div>
    <!-- Sort menu: persistent elements (not rebuilt per open) so the
         cursor/chosen highlighting code can keep references to them. -->
    <div id="sort-menu">
      <div class="sort-opt" data-sort="title">Song</div>
      <div class="sort-opt" data-sort="artist">Artist<span class="sort-value" data-sort-value="artist"></span></div>
      <div class="sort-opt" data-sort="album">Album<span class="sort-value" data-sort-value="album"></span></div>
      <div class="sort-opt" data-sort="genre">Genre<span class="sort-value" data-sort-value="genre"></span></div>
      <div class="sort-opt" data-sort="top100">Top 100</div>
      <div class="sort-opt" data-sort="mostplayed">Most Played</div>
    </div>
  </div>
</div>

<div id="debug">
  <div id="status" class="disconnected">connecting...</div>
  <div id="log"></div>
</div>
<script>
  // ---- build the 5x20 letter+digit board (A1-K0), per the dev plan ----
  const letterPairs = [['A','B'], ['C','D'], ['E','F'], ['G','H'], ['J','K']];
  const digits = ['1','2','3','4','5','6','7','8','9','0'];
  const board = document.getElementById('board');

  letterPairs.forEach(([l1, l2]) => {
    const col = document.createElement('div');
    col.className = 'col';
    [l1, l2].forEach(letter => {
      digits.forEach(d => {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.innerHTML = '<span class="label">' + letter + d + '</span>' +
          '<span class="text"><span class="title">&mdash;</span><span class="artist"></span></span>';
        col.appendChild(slot);
      });
    });
    board.appendChild(col);
  });

  // ---- library board: paginate the full snapshot from jb-library ----
  // Two board modes: 'songs' (a flat, playable track list -- either the
  // whole library sorted by title, or a category drill-down's results)
  // and 'categories' (browsing the unique Artist/Album/Genre values
  // themselves, before a specific one is picked).
  const slotEls = Array.from(document.querySelectorAll('.slot'));
  const slotTitleEls = slotEls.map((el) => el.querySelector('.title'));
  const slotArtistEls = slotEls.map((el) => el.querySelector('.artist'));
  const PAGE_SIZE = slotTitleEls.length; // 100, one page of the letter+digit board
  let libraryTracks = []; // as received from jb-library, always title-sorted
  let sortedTracks = [];  // the flat track list currently on the board
  let categoryValues = []; // unique values for the active category field
  let sortField = 'title';
  let categoryFilter = null; // {field, value} once a specific artist/album/genre is picked
  let boardMode = 'songs';   // 'songs' | 'categories'
  let currentPage = 0;

  function getUniqueValues(field) {
    const seen = new Set();
    const values = [];
    for (const t of libraryTracks) {
      const v = t[field];
      if (v && !seen.has(v)) {
        seen.add(v);
        values.push(v);
      }
    }
    values.sort((a, b) => a.localeCompare(b));
    return values;
  }

  const byTitle = (a, b) => (a.title || '').localeCompare(b.title || '');
  // Ranked lists: flat song lists in a fixed order, no drill-down.
  const RANKED_SORTS = {
    // Global popularity (Last.fm listeners, looked up by jb-library);
    // exactly one board page.
    top100: () => libraryTracks
      .filter((t) => t.popularity)
      .sort((a, b) => b.popularity - a.popularity || byTitle(a, b))
      .slice(0, 100),
    // Plays on this jukebox (counted by jb-library after 30s of play).
    mostplayed: () => libraryTracks
      .filter((t) => t.play_count > 0)
      .sort((a, b) => b.play_count - a.play_count
        || (b.last_played_at || 0) - (a.last_played_at || 0) || byTitle(a, b)),
  };

  function applySort() {
    if (RANKED_SORTS[sortField]) {
      boardMode = 'songs';
      sortedTracks = RANKED_SORTS[sortField]();
    } else if (sortField !== 'title' && categoryFilter && categoryFilter.field === sortField) {
      // Drilled into a specific artist/album/genre -- flat list of just
      // the songs matching it.
      boardMode = 'songs';
      sortedTracks = libraryTracks
        .filter((t) => t[sortField] === categoryFilter.value)
        .sort((a, b) => (a.title || '').localeCompare(b.title || ''));
    } else if (sortField !== 'title') {
      // Browsing the category itself -- one slot per unique value.
      boardMode = 'categories';
      categoryValues = getUniqueValues(sortField);
    } else {
      boardMode = 'songs';
      sortedTracks = [...libraryTracks].sort((a, b) => (a.title || '').localeCompare(b.title || ''));
    }
  }

  function updateSortValueLabels() {
    document.querySelectorAll('.sort-value').forEach((el) => {
      const field = el.dataset.sortValue;
      el.textContent = categoryFilter && categoryFilter.field === field ? categoryFilter.value : '';
    });
  }

  function renderPage() {
    const start = currentPage * PAGE_SIZE;
    for (let i = 0; i < PAGE_SIZE; i++) {
      let newText, newArtist, newTooltip;
      if (boardMode === 'categories') {
        const value = categoryValues[start + i];
        newText = value || '—';
        newArtist = '';
        newTooltip = '';
      } else {
        const track = sortedTracks[start + i];
        newText = track ? track.title : '—';
        newArtist = (track && track.artist) || '';
        newTooltip = track && track.artist ? track.title + ' — ' + track.artist : '';
      }
      slotTitleEls[i].textContent = newText;
      slotTitleEls[i].title = newTooltip;
      slotArtistEls[i].textContent = newArtist;
    }
  }

  // Slide/carousel page-turn (Back/Forward only): snapshot the current
  // board as a clone positioned exactly on top of the real one, swap the
  // real board's content to the new page while it's off-screen, then
  // slide the clone out and the real board in from the opposite side at
  // the same time. direction: +1 = Forward (board enters from the
  // right), -1 = Back (enters from the left).
  const SLIDE_DURATION_MS = 800;
  const SLIDE_STAGGER_MS = 350; // head start the outgoing card gets before the new one starts entering

  function slidePage(direction) {
    const board = document.getElementById('board');
    const rect = board.getBoundingClientRect();
    // Translating by 100% of the board's *own* width isn't enough to
    // clear the screen -- it sits inside padded content, not flush with
    // the viewport edge, so a sliver of the incoming card was visible
    // immediately on click. Use the actual viewport width instead, so
    // both cards genuinely start/end fully off-screen.
    const offscreen = window.innerWidth + 40;
    const clone = board.cloneNode(true);
    // Deliberately kept id="board" (not removed) -- that's what the
    // #board { display: flex; ... } CSS rule targets, and without it the
    // clone's columns collapse into an unstyled stack instead of staying
    // clipped, which is what caused the "runs off the bottom" glitch.
    // Nothing looks up getElementById('board') during the brief window
    // both copies exist, so the duplicate id is harmless here.
    clone.style.position = 'fixed';
    clone.style.boxSizing = 'border-box';
    clone.style.top = rect.top + 'px';
    clone.style.left = rect.left + 'px';
    clone.style.width = rect.width + 'px';
    clone.style.height = rect.height + 'px';
    clone.style.margin = '0';
    clone.style.zIndex = '5';
    clone.style.transition = 'none';
    clone.style.transform = 'translateX(0)';
    document.body.appendChild(clone);

    board.style.transition = 'none';
    board.style.transform = `translateX(${direction > 0 ? offscreen : -offscreen}px)`;
    renderPage(); // swap to the new page's content while off-screen

    void board.offsetHeight; // force reflow before animating

    // Outgoing clone starts immediately; the incoming board gets a delayed
    // start so the old card is already well on its way out before the new
    // one begins entering, rather than both moving as one simultaneous swap.
    requestAnimationFrame(() => {
      clone.style.transition = `transform ${SLIDE_DURATION_MS}ms ease-in-out`;
      clone.style.transform = `translateX(${direction > 0 ? -offscreen : offscreen}px)`;
    });

    setTimeout(() => {
      board.style.transition = `transform ${SLIDE_DURATION_MS}ms ease-in-out`;
      board.style.transform = 'translateX(0)';
    }, SLIDE_STAGGER_MS);

    setTimeout(() => {
      clone.remove();
      board.style.transition = 'none';
    }, SLIDE_STAGGER_MS + SLIDE_DURATION_MS + 30);
  }

  function pageBack() {
    if (currentPage > 0) { currentPage--; slidePage(-1); }
  }
  function pageForward() {
    const total = boardMode === 'categories' ? categoryValues.length : sortedTracks.length;
    const maxPage = Math.max(0, Math.ceil(total / PAGE_SIZE) - 1);
    if (currentPage < maxPage) { currentPage++; slidePage(1); }
  }

  // Picking a slot: in 'categories' mode, drills into that value (shows
  // its songs); in 'songs' mode, queues that track. No real alphanumeric
  // code-entry input exists yet (Phase 2b), so slots are click-selectable
  // here purely as a temporary testing stand-in -- not a real input method,
  // this build has no mouse/touch in the final product.
  function selectSlot(i) {
    const start = currentPage * PAGE_SIZE;
    if (boardMode === 'categories') {
      const value = categoryValues[start + i];
      if (!value) return;
      categoryFilter = { field: sortField, value };
      applySort();
      currentPage = 0;
      renderPage();
      updateSortValueLabels();
    } else {
      const track = sortedTracks[start + i];
      if (!track) return;
      publishCmd('jukebox/jb-core/cmd', { action: 'select', track });
    }
  }
  slotEls.forEach((el, i) => el.addEventListener('click', () => selectSlot(i)));

  // ---- now playing: from jb-source-phone, artwork cross-referenced by
  // title against the library snapshot we already have loaded for the board ----
  const npArt = document.getElementById('np-art');
  const npBg = document.getElementById('np-bg');
  const npTitle = document.getElementById('np-title');
  const npArtist = document.getElementById('np-artist');
  const npElapsed = document.getElementById('np-elapsed');
  const npDuration = document.getElementById('np-duration');
  const npProgressBar = document.getElementById('np-progress-bar');
  const npPlayPause = document.getElementById('np-playpause');

  function formatMs(ms) {
    if (!ms && ms !== 0) return '0:00';
    const totalSec = Math.floor(ms / 1000);
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  function updateNowPlaying(np) {
    if (np.status !== 'playing') {
      // Nothing actually playing (includes jb-core's deliberate pause when
      // the queue is empty) -- show empty rather than a frozen last track,
      // which reads as "just paused mid-song" instead of "idle".
      npTitle.textContent = '—';
      npArtist.textContent = '';
      npElapsed.textContent = '0:00';
      npDuration.textContent = '0:00';
      npProgressBar.style.width = '0%';
      npPlayPause.textContent = '▶';
      npArt.style.backgroundImage = '';
      npBg.classList.remove('visible');
      return;
    }

    npTitle.textContent = np.title || '—';
    npArtist.textContent = np.artist || '';
    npElapsed.textContent = formatMs(np.position_ms);
    npDuration.textContent = formatMs(np.duration_ms);
    const pct = np.duration_ms ? Math.min(100, (100 * np.position_ms) / np.duration_ms) : 0;
    npProgressBar.style.width = pct + '%';
    npPlayPause.textContent = '‖';

    const match = libraryTracks.find((t) => t.title === np.title);
    const artUrl = match && match.artwork_url ? 'url(' + match.artwork_url + ')' : '';
    npArt.style.backgroundImage = artUrl;
    // Only touch the backdrop when the art actually changes -- now-playing
    // arrives every ~2s while playing (position updates).
    // (Compare against our own copy: style.backgroundImage reads back
    // normalized with quotes, so it would never match artUrl.)
    if (npBg.dataset.art !== artUrl) {
      npBg.dataset.art = artUrl;
      npBg.style.backgroundImage = artUrl;
    }
    npBg.classList.toggle('visible', !!artUrl);
  }

  // ---- up next: the real queue from jb-core ----
  const upNext = document.getElementById('up-next');
  const upNextList = document.getElementById('up-next-list');
  const upNextHeader = document.getElementById('up-next-header');
  const upNextThumb = document.getElementById('up-next-scroll-thumb');

  function el(tag, className, text) {
    const e = document.createElement(tag);
    e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function renderUpNext(data) {
    upNextList.innerHTML = '';
    setShuffleUI(!!data.shuffle_active); // jb-core is the source of truth
    const tracks = data.upcoming || [];
    // Count only in Singles mode: shuffle keeps a constantly refilled
    // 20-track buffer, so a number there would always read ~20.
    upNextHeader.textContent = tracks.length && !data.shuffle_active
      ? 'Up Next (' + tracks.length + ')' : 'Up Next';
    if (tracks.length === 0) {
      const msg = el('div', '', 'Select any Single. Or tap Shuffle to auto play.');
      msg.id = 'upnext-empty-msg';
      upNextList.appendChild(msg);
      updateUpNextScroll();
      return;
    }
    tracks.forEach((track, i) => {
      const item = el('div', 'queue-item');
      const art = el('div', 'art');
      if (track.artwork_url) art.style.backgroundImage = 'url(' + track.artwork_url + ')';
      const meta = el('div', 'meta');
      meta.append(el('div', 'title', track.title), el('div', 'artist', track.artist || ''));
      item.append(art, el('div', 'num', String(i + 1)), meta);
      upNextList.appendChild(item);
    });
    updateUpNextScroll();
  }

  // Custom scroll indicator: thumb width/position mirror the list's scroll.
  function updateUpNextScroll() {
    const { scrollWidth, clientWidth, scrollLeft } = upNextList;
    const ratio = scrollWidth > 0 ? Math.min(1, clientWidth / scrollWidth) : 1;
    upNextThumb.style.width = (ratio * 100) + '%';
    upNextThumb.style.left = (scrollWidth > 0 ? (scrollLeft / scrollWidth) * 100 : 0) + '%';
  }
  upNextList.addEventListener('scroll', updateUpNextScroll);

  // One encoder detent scrolls by one queue item.
  function scrollUpNext(direction) {
    const item = upNextList.querySelector('.queue-item');
    upNextList.scrollLeft += direction * (item ? item.offsetWidth : 100);
  }

  // =========================================================================
  // Encoder-driven navigation: one rotary encoder (rotate + click) drives
  // almost everything. Rotating cycles a highlight through every
  // [data-select] element (the board as a whole is one of them; its
  // individual song slots are not). Clicking either fires a one-shot
  // action (Back/Forward/Shuffle-toggle/sort commit) or temporarily
  // repurposes rotation for a secondary function (Volume's slider, Up
  // Next's side-scroll, the board's Sort menu option-cycling) until
  // a period of inactivity times it back out to plain selection.
  //
  // No physical encoder exists yet -- Left/Right arrow keys simulate
  // rotation and Enter simulates a click, until the real hardware (via the
  // Pico, arriving as USB HID keyboard events) replaces this.
  // =========================================================================

  // Explicit rotation order -- kept in sync with actual visual layout
  // (reading top-to-bottom, left-to-right) rather than left implicit via
  // DOM order, so it's obvious this needs updating by hand if the layout
  // changes again. Current layout: header row (Phone/Library/Spotify),
  // then Volume/Prev/Next/Shuffle/Now Playing/Up Next, then the board
  // (whose click opens the Sort menu).
  const SELECT_ORDER = [
    'phone', 'library', 'spotify', 'volume', 'back', 'forward', 'shuffle',
    'nowplaying', 'upnext', 'board',
  ];
  const selectables = SELECT_ORDER.map(
    (key) => document.querySelector('[data-select="' + key + '"]')
  );
  const sortOptEls = Array.from(document.querySelectorAll('.sort-opt'));
  const sortFields = sortOptEls.map((el) => el.dataset.sort);

  let mode = 'select'; // 'select' | 'volume' | 'upnext-scroll' | 'sort' | 'popup'
  // Volume is the "home" resting position -- the thing most likely to get
  // adjusted, so idle selection always drifts back to it -- independent
  // of SELECT_ORDER's traversal sequence.
  const HOME_INDEX = SELECT_ORDER.indexOf('volume');
  let selectedIndex = HOME_INDEX;
  let sortCursor = sortFields.indexOf(sortField);
  let currentVolume = 0.3;
  let shuffleActive = false;
  let phoneConnected = false;
  let phoneName = 'Bluetooth';
  const MODE_TIMEOUT_MS = 4000;
  const HOME_TIMEOUT_MS = 12000;
  let homeTimer = null;

  // Inactive: "SHUFFLE" + a cyclical icon (click to start shuffling).
  // Active: "SINGLES" + a single right arrow (click to go back to
  // normal single-play/manual mode) -- the label itself is the mode
  // indicator, not just an icon color.
  function setShuffleUI(active) {
    shuffleActive = active;
    document.getElementById('shuffle-btn').classList.toggle('active', active);
    document.getElementById('shuffle-icon').innerHTML = active ? '&#8594;' : '&#8646;';
    document.getElementById('shuffle-label').textContent = active ? 'SINGLES' : 'SHUFFLE';
  }
  let modeTimer = null;

  function highlightSelection() {
    selectables.forEach((el, i) =>
      el.classList.toggle('encoder-selected', mode === 'select' && i === selectedIndex)
    );
  }
  highlightSelection();
  armHomeTimeout();

  function armModeTimeout() {
    clearTimeout(modeTimer);
    modeTimer = setTimeout(exitMode, MODE_TIMEOUT_MS);
  }

  function armHomeTimeout() {
    clearTimeout(homeTimer);
    homeTimer = setTimeout(goHome, HOME_TIMEOUT_MS);
  }

  function goHome() {
    if (mode !== 'select') return; // only drifts home while at rest
    selectedIndex = HOME_INDEX;
    highlightSelection();
  }

  function exitMode() {
    clearTimeout(modeTimer);
    modeTimer = null;
    mode = 'select';
    hidePopup();
    upNext.classList.remove('scrolling');
    updateSortHighlight();
    highlightSelection();
    armHomeTimeout();
  }

  function showPopup(title, bodyHtml) {
    document.getElementById('popup-title').textContent = title;
    document.getElementById('popup-body').innerHTML = bodyHtml;
    document.getElementById('popup-overlay').classList.add('visible');
  }
  function hidePopup() {
    document.getElementById('popup-overlay').classList.remove('visible');
    document.getElementById('sort-menu').classList.remove('visible');
  }

  function showSortMenu() {
    showPopup('SORT BY', '');
    document.getElementById('sort-menu').classList.add('visible');
  }

  // A backend-triggered popup (e.g. "connect device") that isn't part of
  // the encoder mode/click state machine -- shows briefly, then closes
  // itself, without disturbing whatever mode the user is actually in.
  function flashNotice(title, bodyHtml, duration = 4000) {
    showPopup(title, bodyHtml);
    setTimeout(() => {
      if (mode === 'select') hidePopup();
    }, duration);
  }

  function renderVolumePopup() {
    const pct = Math.round(currentVolume * 100);
    showPopup(
      'VOLUME',
      '<div class="volume-slider-track"><div class="volume-slider-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="volume-pct">' + pct + '%</div>'
    );
  }

  function updateSortHighlight() {
    sortOptEls.forEach((el, i) => {
      el.classList.toggle('cursor', mode === 'sort' && i === sortCursor);
      el.classList.toggle('chosen', sortFields[i] === sortField);
    });
  }
  updateSortHighlight();

  function publishCmd(topic, payload) {
    client.publish(topic, JSON.stringify(payload));
  }

  function rotate(direction) {
    if (mode === 'select') {
      selectedIndex = (selectedIndex + direction + selectables.length) % selectables.length;
      highlightSelection();
      armHomeTimeout();
      return;
    }
    if (mode === 'volume') {
      currentVolume = Math.max(0, Math.min(1, currentVolume + direction * 0.05));
      publishCmd('jukebox/jb-audio/cmd', { action: 'volume_delta', value: direction * 0.05 });
      renderVolumePopup();
    } else if (mode === 'upnext-scroll') {
      scrollUpNext(direction);
    } else if (mode === 'sort') {
      sortCursor = (sortCursor + direction + sortFields.length) % sortFields.length;
      updateSortHighlight();
    }
    armModeTimeout(); // any rotation while in a secondary mode resets its timeout
  }

  function click() {
    if (mode === 'select') armHomeTimeout(); // any activity resets the idle clock
    if (mode === 'sort') {
      const chosen = sortFields[sortCursor];
      if (chosen === sortField && categoryFilter && categoryFilter.field === chosen) {
        categoryFilter = null; // already drilled in -- go back up to the category list
      }
      sortField = chosen;
      applySort();
      currentPage = 0;
      renderPage();
      updateSortValueLabels();
      exitMode();
      return;
    }
    if (mode !== 'select') {
      // Volume / Up Next scroll / informational popups: a click just
      // closes early rather than doing anything else.
      exitMode();
      return;
    }

    const key = selectables[selectedIndex].dataset.select;
    switch (key) {
      case 'volume':
        mode = 'volume';
        renderVolumePopup();
        armModeTimeout();
        break;
      case 'phone':
        mode = 'popup';
        showPopup('BLUETOOTH', phoneConnected ? phoneName + '<br>Connected' : 'No device connected');
        armModeTimeout();
        break;
      case 'library':
        mode = 'popup';
        showPopup('LIBRARY', 'Not built yet');
        armModeTimeout();
        break;
      case 'spotify':
        mode = 'popup';
        showPopup('SPOTIFY', 'Not built yet');
        armModeTimeout();
        break;
      case 'nowplaying':
        // Pinned -- no dedicated function decided yet, just an enlarged
        // view of what's already shown in the strip.
        mode = 'popup';
        showPopup('NOW PLAYING', (npTitle.textContent || '—') + '<br>' + (npArtist.textContent || ''));
        armModeTimeout();
        break;
      case 'shuffle':
        setShuffleUI(!shuffleActive);
        publishCmd('jukebox/jb-core/cmd', { action: shuffleActive ? 'shuffle_on' : 'shuffle_off' });
        break;
      case 'upnext':
        mode = 'upnext-scroll';
        upNext.classList.add('scrolling'); // reveals the scroll indicator
        updateUpNextScroll();
        armModeTimeout();
        break;
      case 'board':
        mode = 'sort';
        sortCursor = sortFields.indexOf(sortField); // open on the current sort
        updateSortHighlight();
        showSortMenu();
        armModeTimeout();
        break;
      case 'back':
        pageBack();
        break;
      case 'forward':
        pageForward();
        break;
    }
  }

  // The knob arrives from jb-input over the bus (jukebox/jb-input/gesture):
  // jb-input grabs the Pico keypad exclusively, so its keys never reach this
  // page directly -- which also means navigation works whether or not the
  // kiosk window has keyboard focus. A turn carries signed steps (clockwise
  // positive); each step is one rotate(), exactly like one detent was before.
  function handleKnob(data) {
    if (data.control !== 'knob') return;
    if (data.gesture === 'turn') {
      const dir = data.steps > 0 ? 1 : -1;
      for (let i = 0; i < Math.abs(data.steps); i++) rotate(dir);
    } else if (data.gesture === 'click') {
      click();
    }
  }

  // A real keyboard still works for development (arrows + Enter).
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft') rotate(-1);
    else if (e.key === 'ArrowRight') rotate(1);
    else if (e.key === 'Enter') click();
  });

  // ---- bus debug overlay (unchanged) ----
  const statusEl = document.getElementById('status');
  const logEl = document.getElementById('log');
  const MAX_LINES = 200;

  // timerVariant 'native': mqtt.js's default ('auto') runs its keepalive
  // timers in a worker (worker-timers), which breaks when the wall clock
  // jumps -- and it always does at boot: the Pi has no RTC, starts at its
  // last-shutdown time, then NTP jumps it forward (by ~a day after an
  // overnight power-off). With worker timers that produced a "Keepalive
  // timeout" every 1-3s after each connect, forever: the boot-time
  // connect/disconnect flapping. Reproduced by backdating
  // /var/lib/systemd/timesync/clock and rebooting.
  const client = mqtt.connect('ws://localhost:9001', { timerVariant: 'native' });

  client.on('connect', () => {
    statusEl.textContent = 'connected to bus';
    statusEl.className = 'connected';
    // Only what the page uses -- not jukebox/#, which would also pull in
    // large payloads it ignores (e.g. the retained crawl-result).
    client.subscribe([
      'jukebox/+/heartbeat',
      'jukebox/jb-library/tracks',
      'jukebox/jb-source-phone/now-playing',
      'jukebox/jb-source-phone/connected',
      'jukebox/jb-source-phone/play-error',
      'jukebox/jb-core/queue',
      'jukebox/jb-core/notice',
      'jukebox/jb-audio/state',
      'jukebox/jb-input/gesture',
      'jukebox/jb-core/selection',
    ]);
  });

  client.on('reconnect', () => {
    statusEl.textContent = 'reconnecting...';
    statusEl.className = 'disconnected';
  });

  client.on('close', () => {
    statusEl.textContent = 'disconnected';
    statusEl.className = 'disconnected';
  });

  client.on('message', (topic, payload) => {
    // mqtt.js calls this synchronously from its stream parser -- an
    // exception escaping here can tear down the connection itself. One bad
    // message should cost that message, not the bus.
    try {
      handleMessage(topic, payload);
    } catch (e) {
      console.error('failed handling', topic, e);
    }
    appendDebugLine(topic, payload);
  });

  function handleMessage(topic, payload) {
    if (topic === 'jukebox/jb-input/gesture') {
      handleKnob(JSON.parse(payload.toString()));
    } else if (topic === 'jukebox/jb-core/selection') {
      // A keypad selection (letter then digit) from jb-core. Slot index
      // 0-99 is A1..K0 in board order; this page owns which track is
      // shown at each slot (current page and sort), so it resolves the
      // slot here and queues it exactly like picking the slot directly.
      const data = JSON.parse(payload.toString());
      if (Number.isInteger(data.index) && data.index >= 0 && data.index < PAGE_SIZE) {
        selectSlot(data.index);
      }
    } else if (topic === 'jukebox/jb-library/tracks') {
      const data = JSON.parse(payload.toString());
      libraryTracks = data.tracks;
      applySort();
      renderPage();
    } else if (topic === 'jukebox/jb-source-phone/now-playing') {
      updateNowPlaying(JSON.parse(payload.toString()));
    } else if (topic === 'jukebox/jb-core/queue') {
      renderUpNext(JSON.parse(payload.toString()));
    } else if (topic === 'jukebox/jb-source-phone/connected') {
      const data = JSON.parse(payload.toString());
      phoneConnected = !!data.connected;
      phoneName = data.name || 'Bluetooth';
      const phoneTab = document.getElementById('sel-phone');
      phoneTab.textContent = phoneConnected ? phoneName : 'Bluetooth';
      phoneTab.classList.toggle('active', phoneConnected);
    } else if (topic === 'jukebox/jb-audio/state') {
      const data = JSON.parse(payload.toString());
      // While actively turning the volume knob, our own optimistic local
      // math (in rotate()) is authoritative -- a backend confirmation for
      // an older command can arrive after several newer local updates
      // already moved the display further, and applying it would snap the
      // slider backwards even though the real volume never actually
      // dropped. Only resync from the backend once the knob is at rest.
      if (typeof data.volume === 'number' && mode !== 'volume') {
        currentVolume = data.volume;
      }
    } else if (topic === 'jukebox/jb-core/notice') {
      const data = JSON.parse(payload.toString());
      if (data.type === 'connect_device') {
        flashNotice('CONNECT DEVICE', 'Please connect your phone to continue.');
      }
    }
  }

  // Debug overlay: payloads are truncated -- the library snapshot alone is
  // ~365KB, and keeping MAX_LINES of those in the DOM is what exhausted the
  // Pi's memory and made the bus connection flap.
  const MAX_PAYLOAD_CHARS = 200;

  function appendDebugLine(topic, payload) {
    let text = payload.toString();
    if (text.length > MAX_PAYLOAD_CHARS) {
      text = text.slice(0, MAX_PAYLOAD_CHARS) + '… (' + Math.round(payload.length / 1024) + ' KB)';
    }
    const line = document.createElement('div');
    line.className = 'line';
    const topicEl = document.createElement('span');
    topicEl.className = 'topic';
    topicEl.textContent = new Date().toLocaleTimeString() + ' ' + topic;
    const payloadEl = document.createElement('span');
    payloadEl.className = 'payload';
    payloadEl.textContent = text;
    line.append(topicEl, payloadEl);
    logEl.prepend(line);
    while (logEl.children.length > MAX_LINES) {
      logEl.removeChild(logEl.lastChild);
    }
  }
</script>
</body>
</html>
