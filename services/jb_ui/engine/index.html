<!doctype html>
<html data-mode="select">
<head>
<meta charset="utf-8">
<!-- Dark before first paint, so the kiosk never flashes white. -->
<meta name="color-scheme" content="dark">
<title>Juk3box</title>
<link rel="stylesheet" href="/engine/engine.css">
<!-- The splash: the same picture sway shows while Chromium starts, so the
     hand-over is invisible. Inline, so it's there on the first paint; the
     engine fades it out once the screen is ready (main.js, reveal). -->
<style>
#jb-splash { position: fixed; inset: 0; z-index: 100; overflow: hidden; background: #7a3db0;
  transition: opacity 700ms ease-out, transform 700ms cubic-bezier(0.4, 0, 0.2, 1); }
#jb-splash.gone { opacity: 0; transform: scale(0.82); }
#jb-splash > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* The live splash fades in over the still one (identical at first) and the
   logo's bars bounce. Only transform moves, on the GPU. (Drifting glows
   behind it delayed the reveal by ~9 s on the Pi 4, so they went.) */
#jb-splash .live { position: absolute; inset: 0; background: #7a3db0; opacity: 0; transition: opacity 900ms ease; }
#jb-splash.live-on .live { opacity: 1; }
/* The logo at 576 px wide, as in splash.png: lettering over its bars. */
#jb-splash .logo { position: absolute; left: 50%; top: 50%; width: 435px; height: 299px; transform: translate(-50%, -50%) scale(1.32414); }
#jb-splash .logo img { position: absolute; inset: 0; width: 100%; height: 100%; }
#jb-splash .logo b { position: absolute; top: 3px; width: 37px; height: 164px; overflow: hidden; }
#jb-splash .logo b::before { content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(currentColor 0 11px, transparent 11px 17px); will-change: transform; }
@keyframes jb-bar0 { 0% { transform: translateY(102px); } 6.3% { transform: translateY(51px); } 12.5% { transform: translateY(136px); } 18.8% { transform: translateY(85px); } 25% { transform: translateY(68px); } 31.3% { transform: translateY(119px); } 37.5% { transform: translateY(102px); } 43.8% { transform: translateY(85px); } 50% { transform: translateY(136px); } 56.3% { transform: translateY(136px); } 62.5% { transform: translateY(102px); } 68.8% { transform: translateY(119px); } 75% { transform: translateY(119px); } 81.3% { transform: translateY(136px); } 87.5% { transform: translateY(68px); } 93.8% { transform: translateY(85px); } 100% { transform: translateY(102px); } }
#jb-splash.playing .b0::before { animation: jb-bar0 1400ms steps(1, end) infinite; }
#jb-splash .b0::before { transform: translateY(102px); }
@keyframes jb-bar1 { 0% { transform: translateY(68px); } 6.3% { transform: translateY(85px); } 12.5% { transform: translateY(85px); } 18.8% { transform: translateY(17px); } 25% { transform: translateY(85px); } 31.3% { transform: translateY(68px); } 37.5% { transform: translateY(119px); } 43.8% { transform: translateY(102px); } 50% { transform: translateY(34px); } 56.3% { transform: translateY(68px); } 62.5% { transform: translateY(119px); } 68.8% { transform: translateY(85px); } 75% { transform: translateY(85px); } 81.3% { transform: translateY(68px); } 87.5% { transform: translateY(102px); } 93.8% { transform: translateY(102px); } 100% { transform: translateY(68px); } }
#jb-splash.playing .b1::before { animation: jb-bar1 1570ms steps(1, end) infinite; }
#jb-splash .b1::before { transform: translateY(68px); }
@keyframes jb-bar2 { 0% { transform: translateY(102px); } 6.3% { transform: translateY(85px); } 12.5% { transform: translateY(85px); } 18.8% { transform: translateY(136px); } 25% { transform: translateY(85px); } 31.3% { transform: translateY(68px); } 37.5% { transform: translateY(85px); } 43.8% { transform: translateY(102px); } 50% { transform: translateY(85px); } 56.3% { transform: translateY(136px); } 62.5% { transform: translateY(102px); } 68.8% { transform: translateY(119px); } 75% { transform: translateY(136px); } 81.3% { transform: translateY(51px); } 87.5% { transform: translateY(85px); } 93.8% { transform: translateY(102px); } 100% { transform: translateY(102px); } }
#jb-splash.playing .b2::before { animation: jb-bar2 1740ms steps(1, end) infinite; }
#jb-splash .b2::before { transform: translateY(102px); }
@keyframes jb-bar3 { 0% { transform: translateY(0px); } 6.3% { transform: translateY(0px); } 12.5% { transform: translateY(0px); } 18.8% { transform: translateY(0px); } 25% { transform: translateY(34px); } 31.3% { transform: translateY(0px); } 37.5% { transform: translateY(0px); } 43.8% { transform: translateY(0px); } 50% { transform: translateY(17px); } 56.3% { transform: translateY(51px); } 62.5% { transform: translateY(0px); } 68.8% { transform: translateY(0px); } 75% { transform: translateY(0px); } 81.3% { transform: translateY(0px); } 87.5% { transform: translateY(0px); } 93.8% { transform: translateY(0px); } 100% { transform: translateY(0px); } }
#jb-splash.playing .b3::before { animation: jb-bar3 1910ms steps(1, end) infinite; }
#jb-splash .b3::before { transform: translateY(0px); }
@keyframes jb-bar4 { 0% { transform: translateY(51px); } 6.3% { transform: translateY(34px); } 12.5% { transform: translateY(51px); } 18.8% { transform: translateY(68px); } 25% { transform: translateY(17px); } 31.3% { transform: translateY(85px); } 37.5% { transform: translateY(51px); } 43.8% { transform: translateY(85px); } 50% { transform: translateY(68px); } 56.3% { transform: translateY(68px); } 62.5% { transform: translateY(51px); } 68.8% { transform: translateY(51px); } 75% { transform: translateY(68px); } 81.3% { transform: translateY(102px); } 87.5% { transform: translateY(34px); } 93.8% { transform: translateY(68px); } 100% { transform: translateY(51px); } }
#jb-splash.playing .b4::before { animation: jb-bar4 2080ms steps(1, end) infinite; }
#jb-splash .b4::before { transform: translateY(51px); }
@keyframes jb-bar5 { 0% { transform: translateY(85px); } 6.3% { transform: translateY(68px); } 12.5% { transform: translateY(102px); } 18.8% { transform: translateY(68px); } 25% { transform: translateY(68px); } 31.3% { transform: translateY(68px); } 37.5% { transform: translateY(119px); } 43.8% { transform: translateY(119px); } 50% { transform: translateY(51px); } 56.3% { transform: translateY(119px); } 62.5% { transform: translateY(34px); } 68.8% { transform: translateY(68px); } 75% { transform: translateY(51px); } 81.3% { transform: translateY(34px); } 87.5% { transform: translateY(136px); } 93.8% { transform: translateY(51px); } 100% { transform: translateY(85px); } }
#jb-splash.playing .b5::before { animation: jb-bar5 2250ms steps(1, end) infinite; }
#jb-splash .b5::before { transform: translateY(85px); }
@keyframes jb-bar6 { 0% { transform: translateY(102px); } 6.3% { transform: translateY(119px); } 12.5% { transform: translateY(68px); } 18.8% { transform: translateY(102px); } 25% { transform: translateY(119px); } 31.3% { transform: translateY(68px); } 37.5% { transform: translateY(136px); } 43.8% { transform: translateY(136px); } 50% { transform: translateY(136px); } 56.3% { transform: translateY(136px); } 62.5% { transform: translateY(136px); } 68.8% { transform: translateY(136px); } 75% { transform: translateY(85px); } 81.3% { transform: translateY(51px); } 87.5% { transform: translateY(68px); } 93.8% { transform: translateY(51px); } 100% { transform: translateY(102px); } }
#jb-splash.playing .b6::before { animation: jb-bar6 2420ms steps(1, end) infinite; }
#jb-splash .b6::before { transform: translateY(102px); }
</style>
<!-- Vendored, pinned: the kiosk must start without internet. -->
<script src="/engine/mqtt-5.16.0.min.js" defer></script>
<script type="module" src="/engine/js/main.js"></script>
</head>
<body>
<div id="jb-splash"><img src="/engine/splash.png" alt="">
<div class="live">
<div class="logo"><b class="b0" style="left: 83px; color: #22e7d4"></b><b class="b1" style="left: 127px; color: #009da4"></b><b class="b2" style="left: 172px; color: #0068a6"></b><b class="b3" style="left: 217px; color: #4f007e"></b><b class="b4" style="left: 262px; color: #ff2198"></b><b class="b5" style="left: 306px; color: #ff63d5"></b><b class="b6" style="left: 351px; color: #ff9959"></b><img src="/engine/splash-logo.png" alt=""></div></div>
</div>
<div id="jb-background"></div>
<div id="jb-root"></div>
</body>
</html>
