<!doctype html>
<html data-mode="select">
<head>
<meta charset="utf-8">
<!-- Dark before first paint, so the kiosk never flashes white. -->
<meta name="color-scheme" content="dark">
<title>JUKE.BOX</title>
<link rel="stylesheet" href="/engine/engine.css">
<!-- The splash: the same picture sway shows while Chromium starts, so the
     hand-over is invisible. Inline, so it's there on the first paint; the
     engine fades it out once the screen is ready (main.js, reveal). -->
<style>
#jb-splash { position: fixed; inset: 0; z-index: 100; background: #0b0b0f url(/engine/splash.png) center / cover no-repeat;
  transition: opacity 700ms ease-out, transform 700ms cubic-bezier(0.4, 0, 0.2, 1); }
#jb-splash.gone { opacity: 0; transform: scale(0.82); }
</style>
<!-- Vendored, pinned: the kiosk must start without internet. -->
<script src="/engine/mqtt-5.16.0.min.js" defer></script>
<script type="module" src="/engine/js/main.js"></script>
</head>
<body>
<div id="jb-splash"></div>
<div id="jb-background"></div>
<div id="jb-root"></div>
</body>
</html>
