<div class="jb-phones">
  <div class="jb-phones-message" data-if="off">Bluetooth is off.</div>
  <div class="jb-phones-list" data-slot="phones"></div>
  <div class="jb-phones-empty" data-if="empty">No phones paired yet.</div>
  <div class="jb-popup-actions">
    <div class="jb-popup-button jb-popup-primary" data-stop="add" data-text="addLabel"></div>
    <div class="jb-popup-button" data-stop="close">Close</div>
  </div>
</div>
