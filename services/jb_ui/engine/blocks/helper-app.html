<section class="jb-settings-section jb-helper-app">
  <h2 class="jb-settings-heading">juk3box Helper app</h2>
  <div class="jb-settings-note" data-text="intro"></div>
  <h3 class="jb-settings-subheading">Phones</h3>
  <div class="jb-settings-list" data-slot="phones"></div>
  <div class="jb-settings-note" data-text="none"></div>
  <h3 class="jb-settings-subheading">Settings</h3>
  <div class="jb-settings-row" data-stop="pairing">
    <span class="jb-settings-label">Allow new phones to pair</span>
    <span class="jb-settings-value" data-text="pairing"></span>
  </div>
  <div class="jb-settings-row" data-stop="ble">
    <span class="jb-settings-label">Wake the app over Bluetooth</span>
    <span class="jb-settings-value" data-text="ble"></span>
  </div>
  <div class="jb-settings-note" data-text="note"></div>
</section>
