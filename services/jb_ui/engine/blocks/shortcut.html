<div class="jb-shortcut">
  <img class="jb-shortcut-image" data-src="image" data-if="image" alt="">
  <div class="jb-shortcut-tint"></div>
  <div class="jb-shortcut-text">
    <span class="jb-shortcut-icon" data-if="hasIcon" data-icon="icon"></span>
    <div class="jb-shortcut-label" data-text="label"></div>
  </div>
  <span class="jb-shortcut-open" data-icon="openIcon"></span>
</div>
