<section class="jb-settings-section jb-display">
  <h2 class="jb-settings-heading">Displays</h2>
  <h3 class="jb-settings-subheading">Picture area</h3>
  <div class="jb-settings-row" data-stop="top">
    <span class="jb-settings-label">Top edge</span>
    <span class="jb-settings-value" data-text="top"></span>
  </div>
  <div class="jb-settings-row" data-stop="bottom">
    <span class="jb-settings-label">Bottom edge</span>
    <span class="jb-settings-value" data-text="bottom"></span>
  </div>
  <div class="jb-settings-row" data-stop="left">
    <span class="jb-settings-label">Left edge</span>
    <span class="jb-settings-value" data-text="left"></span>
  </div>
  <div class="jb-settings-row" data-stop="right">
    <span class="jb-settings-label">Right edge</span>
    <span class="jb-settings-value" data-text="right"></span>
  </div>
  <div class="jb-settings-row" data-stop="reset" data-if="pulledIn">
    <span class="jb-settings-label">Use the whole screen</span>
    <span class="jb-settings-value"></span>
  </div>
  <div class="jb-settings-note" data-text="areaNote"></div>
  <h3 class="jb-settings-subheading">Screen</h3>
  <div class="jb-settings-row" data-stop="rotation">
    <span class="jb-settings-label">Rotation</span>
    <span class="jb-settings-value" data-text="rotation"></span>
  </div>
  <div class="jb-settings-row" data-stop="sleep">
    <span class="jb-settings-label">Screen sleep</span>
    <span class="jb-settings-value" data-text="sleep"></span>
  </div>
  <div class="jb-settings-note" data-text="note"></div>
</section>
