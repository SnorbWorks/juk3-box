<section class="jb-settings-section jb-bluetooth">
  <h2 class="jb-settings-heading">Bluetooth</h2>
  <div class="jb-settings-row" data-stop="power">
    <span class="jb-settings-label">Bluetooth</span>
    <span class="jb-settings-value" data-text="powerLabel"></span>
  </div>
  <div class="jb-settings-note" data-text="note"></div>
  <div class="jb-bluetooth-phones" data-if="on">
    <h3 class="jb-settings-subheading">Phones</h3>
    <div class="jb-settings-list" data-slot="phones"></div>
    <div class="jb-settings-row" data-stop="pair">
      <span class="jb-settings-label">Pair a new phone</span>
      <span class="jb-settings-value">+</span>
    </div>
  </div>
</section>
