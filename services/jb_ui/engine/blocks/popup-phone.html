<div class="jb-phones">
  <div class="jb-phones-message" data-text="status"></div>
  <div class="jb-popup-actions">
    <div class="jb-popup-button jb-popup-primary" data-stop="connect" data-if-not="connected">Connect</div>
    <div class="jb-popup-button" data-stop="disconnect" data-if="connected">Disconnect</div>
    <div class="jb-popup-button jb-popup-danger" data-stop="forget">Forget</div>
    <div class="jb-popup-button" data-stop="back">Back</div>
  </div>
</div>
