<section class="jb-settings-section jb-wholehome">
  <h2 class="jb-settings-heading">Whole-home audio</h2>
  <div class="jb-settings-row" data-stop="power">
    <span class="jb-settings-label">Play in the house too</span>
    <span class="jb-settings-value" data-text="powerLabel"></span>
  </div>
  <div data-if="on">
    <div class="jb-settings-row" data-stop="speaker">
      <span class="jb-settings-label">AirPlay speaker</span>
      <span class="jb-settings-value" data-text="speaker"></span>
    </div>
    <div class="jb-settings-row" data-stop="resync">
      <span class="jb-settings-label">Resync</span>
      <span class="jb-settings-value" data-text="syncLabel"></span>
    </div>
  </div>
  <div class="jb-settings-note" data-text="note"></div>
</section>
