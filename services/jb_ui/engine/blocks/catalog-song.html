<div class="jb-catalog-song">
  <img class="jb-catalog-song-cover" data-src="cover" data-if="cover" alt="">
  <div class="jb-catalog-song-cover jb-catalog-blank" data-if-not="cover"></div>
  <span class="jb-catalog-song-rank" data-if="rank" data-text="rankLabel"></span>
  <div class="jb-catalog-song-text">
    <div class="jb-catalog-song-title"><span class="jb-catalog-explicit" data-if="explicit">E</span><span data-text="title"></span></div>
    <div class="jb-catalog-song-artist" data-text="artist"></div>
  </div>
  <span class="jb-catalog-song-play" data-icon="playIcon"></span>
</div>
