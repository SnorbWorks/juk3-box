// JUKE.BOX's AirPlay receiver: where the juk3box Helper app's songs come in
// (docs/contracts/helper-protocol.md). Into PipeWire like the Bluetooth
// audio, so it goes through the whole-home delay to the DAC and, with
// whole-home on, back out to the house.
//
// Debian's shairport-sync is classic AirPlay (no nqptp): iPhones play to it
// fine. AirPlay 2 (built --with-airplay-2, plus nqptp) is for the Pi 5.
general = {
  name = "JUKE.BOX";
  output_backend = "pa";
  // The cabinet's knob is the volume (the house follows it): the phone's
  // slider doesn't change it.
  ignore_volume_control = "yes";
  interpolation = "basic";
};
sessioncontrol = {
  // A new pick from another phone takes over rather than being refused.
  allow_session_interruption = "yes";
  session_timeout = 20;
};
pa = {
  application_name = "juk3box AirPlay";
};
