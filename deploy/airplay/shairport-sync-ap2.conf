// Juk3box's AirPlay 2 receiver (deploy/airplay: Shairport Sync 5, our build),
// what jb-airplay runs when it can; shairport-sync.conf is the classic one
// (Raspberry Pi OS's package) it falls back to. Same job: where the Juk3box
// Helper app's songs come in (docs/contracts/helper-protocol.md), into
// PipeWire like the Bluetooth audio, so it goes through the whole-home delay
// to the DAC and, with whole-home on, back out to the house.
//
// AirPlay 2 needs NQPTP's clock (jb-nqptp). Version 5 renamed some settings
// (the "pa" section is now "pulseaudio"): CONFIGURATIONFILECHANGES5.md.
general = {
  name = "Juk3box";
  output_backend = "pulseaudio";
  // The cabinet's knob is the volume (the house follows it): the phone's
  // slider doesn't change it.
  ignore_volume_control = "yes";
  interpolation = "auto";
};
sessioncontrol = {
  // A new pick from another phone takes over rather than being refused
  // (classic AirPlay; AirPlay 2 always lets a new player take over).
  allow_session_interruption = "yes";
  // AirPlay 2's shortest (the classic receiver's is 20).
  session_timeout = 60;
};
pulseaudio = {
  // jb-audio's phone volume tells this stream from the phones' by its name.
  application_name = "juk3box AirPlay";
};
