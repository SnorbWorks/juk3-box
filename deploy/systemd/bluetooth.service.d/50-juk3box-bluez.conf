# bluetoothd through deploy/bluez/jb-bluetoothd: BlueZ with the jukebox's
# AVRCP fixes when there's a build of it for the BlueZ installed, the
# system's own otherwise (and after ours has failed, until the next start).
[Service]
ExecStart=
ExecStart=/usr/local/sbin/jb-bluetoothd
ExecStopPost=+/usr/local/sbin/jb-bluetoothd --stopped
