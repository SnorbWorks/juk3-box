# A protected start (deploy/jb-rootfs: overlayroot= on the kernel line) has
# the in-memory overlay as /, which can't be remounted from fstab: the unit
# failed on every protected start, harmlessly, and looked alarming in the
# log. Skipped then; an unprotected start still runs it.
[Unit]
ConditionKernelCommandLine=!overlayroot
