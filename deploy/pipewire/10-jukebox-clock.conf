# Juk3box: the graph's period never drops below 1024 samples (21 ms at
# 48 kHz). A stream that asks for less (Bluetooth asks 512, a 256 test
# stream got 256) shrank it for everyone while it played, and the DAC
# skipped once as each song started on the Pi 4 (2026-10-20). Nothing here
# needs low latency; the whole-home delay is ~1.4 s anyway.
# Install: ~/.config/pipewire/pipewire.conf.d/ (admin), then restart
# pipewire, or live: pw-metadata -n settings 0 clock.min-quantum 1024
context.properties = {
    default.clock.min-quantum = 1024
}
