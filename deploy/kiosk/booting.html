<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Dark before first paint, so the kiosk never flashes white. -->
<meta name="color-scheme" content="dark">
<title>Juk3box</title>
<!--
  The kiosk's hold page.  The real screen is jb-ui on 127.0.0.1:8090; while
  that's still coming up (every boot, and for the minutes an update spends
  installing across a couple of restarts), Chromium would otherwise land on
  its own "This site can't be reached" error.  kiosk-chromium.sh opens this
  local file instead -- it needs no server -- and it waits for jb-ui and goes
  there the instant it answers.  ?installing=1 (jb-update left its marker)
  makes it say an update is under way; ?to= is where to go (jb-ui).
  Self-contained: no network, no fonts, no scripts from elsewhere.
-->
<style>
  html, body { margin: 0; height: 100%; background: #7a3db0; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  /* The same picture sway shows as the wallpaper, so the hand-over is seamless. */
  #bg { position: fixed; inset: 0; background: #7a3db0 center/cover no-repeat;
    background-image: url("file:///opt/juk3-box/services/jb_ui/engine/splash.png"); }
  /* A soft darkening at the bottom so the status reads over the picture. */
  #scrim { position: fixed; inset: 0; background: linear-gradient(to bottom,
    rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
  #status { position: fixed; left: 0; right: 0; bottom: 8vh; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5); padding: 0 6vw; }
  .ring { width: 46px; height: 46px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.28); border-top-color: #fff;
    animation: spin 900ms linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { margin: 0; font-size: clamp(22px, 3.4vw, 40px); font-weight: 650; letter-spacing: 0.2px; }
  p { margin: 0; font-size: clamp(14px, 1.8vw, 21px); line-height: 1.45;
    color: rgba(255,255,255,0.86); max-width: 26em; }
  /* Respect reduced motion: no spinner animation, a steady ring instead. */
  @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
</style>
</head>
<body>
<div id="bg"></div>
<div id="scrim"></div>
<div id="status" role="status" aria-live="polite">
  <div class="ring" aria-hidden="true"></div>
  <h1 id="head">Starting up…</h1>
  <p id="sub">Just a moment.</p>
</div>
<script>
  "use strict";
  var params = new URLSearchParams(location.search);
  // Where the real screen lives.  Default to jb-ui so a bad/absent param
  // still works; only accept a local http(s) target, never somewhere else.
  var to = params.get("to") || "http://127.0.0.1:8090/";
  try {
    var u = new URL(to);
    if (u.protocol !== "http:" && u.protocol !== "https:") throw 0;
  } catch (e) { to = "http://127.0.0.1:8090/"; }

  var installing = params.get("installing") === "1";
  if (installing) {
    document.getElementById("head").textContent = "Installing update";
    document.getElementById("sub").textContent =
      "This takes a few minutes, and the jukebox restarts a couple of times. " +
      "You don't need to do anything — it comes back on its own.";
  }

  // Wait for jb-ui, then go to it.  A no-cors request just needs to resolve
  // (the server answered); a refused connection throws, and we try again.
  var done = false;
  function reach() {
    if (done) return;
    fetch(to, { mode: "no-cors", cache: "no-store" })
      .then(function () { if (!done) { done = true; location.replace(to); } })
      .catch(function () {});
  }
  // A short wait before the first try, so a near-instant jb-ui doesn't make
  // this page blink past; then keep checking.
  setTimeout(reach, 400);
  setInterval(reach, 1000);
</script>
</body>
</html>
