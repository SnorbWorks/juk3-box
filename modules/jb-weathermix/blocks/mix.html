<div class="jbm">
  <div class="jbm-open" data-stop="open">
    <span class="jbm-icon jbm-weather-icon" data-icon="icon"></span>
    <span class="jbm-icon jbm-plain-icon" data-icon="plainIcon"></span>
    <div class="jbm-text">
      <div class="jbm-kicker">Weather Mix<span class="jbm-weather"> · <span data-text="subtitle"></span></span></div>
      <div class="jbm-hook" data-text="hook"></div>
      <div class="jbm-headline" data-text="headline"></div>
      <div class="jbm-meta" data-text="countLabel"></div>
    </div>
    <div class="jbm-covers">
      <img data-src="cover1" data-if="cover1" alt=""><img data-src="cover2" data-if="cover2" alt=""><img data-src="cover3" data-if="cover3" alt=""><img data-src="cover4" data-if="cover4" alt="">
    </div>
    <span class="jbm-go" data-icon="openIcon"></span>
  </div>
  <div class="jbm-play" data-stop="play"><span data-icon="playIcon"></span></div>
</div>
